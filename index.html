<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FlexOrbit — a small browser game for learning CSS Flexbox.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Loaded in dependency order. `defer` keeps the order AND waits for the DOM. -->
    <script src="js/Level.js" defer></script>   <!-- the Level class            -->
    <script src="js/Game.js" defer></script>    <!-- the Game (main) class      -->
    <script src="js/levels.js" defer></script>  <!-- the level definitions      -->
    <script src="script.js" defer></script>     <!-- starts the game            -->

    <title>FlexOrbit — Flexbox Game</title>
</head>
<body>
    <div class="starfield"></div>

    <header class="topbar">
        <h1 class="topbar__title">Flex<span>Orbit</span></h1>
        <div class="topbar__meta">
            <!-- Filled in by Game.render(): "Level 1 of 6" -->
            <span class="level-indicator" id="level-indicator">Level 1</span>
            <span class="difficulty-badge difficulty-badge--easy" id="difficulty-badge">easy</span>
            <span class="score-chip" id="score">0 pts</span>
        </div>
    </header>

    <main class="layout">
        <aside class="left-panel">
            <!-- Level picker: one chip per level, built by Game.renderLevelNav().
                 Finished levels stay clickable so the player can replay them. -->
            <nav class="level-nav" id="level-nav" aria-label="Level selection"></nav>

            <section class="instructions">
                <h2 id="level-title">Loading…</h2>
                <p id="level-instruction"></p>
            </section>

            <!-- The "editor": a style.css rule whose values are real <select> elements. -->
            <section class="editor-pane">
                <div class="editor-pane__header">
                    <span class="editor-pane__dot editor-pane__dot--red"></span>
                    <span class="editor-pane__dot editor-pane__dot--yellow"></span>
                    <span class="editor-pane__dot editor-pane__dot--green"></span>
                    <span class="editor-pane__filename">style.css</span>
                </div>

                <div class="editor-pane__code" id="controls"></div>

                <div class="editor-pane__footer">
                    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
                    <p class="attempts" id="attempts">No mistakes yet</p>
                    <div class="actions">
                        <button type="button" class="btn btn--primary" id="btn-check">Check solution</button>
                        <button type="button" class="btn" id="btn-reset">Reset level</button>
                        <button type="button" class="btn btn--next" id="btn-next" hidden>Next level →</button>
                    </div>
                </div>
            </section>
        </aside>

        <section class="visualization" id="visualization">
            <!-- .stage only reserves the on-screen (scaled) space; #board keeps its
                 fixed 800x500 layout size on every screen so the solutions never change. -->
            <div class="stage" id="stage">
                <div class="orbit" id="board"></div>
            </div>
        </section>
    </main>
</body>
</html>
